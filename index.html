       APP SHELL
  ========================================================= -->
  <div id="app" class="app-shell">

    <!-- SPLASH SCREEN -->
    <div id="splash-screen" class="splash-screen">
      <div class="splash-content">
        <div class="splash-logo">
          <div class="splash-icon">📚</div>
          <h1 class="splash-title">STUDYVERSE</h1>
          <p class="splash-tagline">Plan Smart. Study Better. Become a CA.</p>

        <div class="splash-loader">

        </div>

    </div>

    <!-- AUTH LAYER (shown when not logged in) -->

    </div>

    <!-- MAIN APP (shown when logged in) -->
    <div id="main-app" class="main-app hidden">

      <!-- SIDEBAR -->
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <span class="logo-icon">📚</span>
            <div class="logo-text">
              <span class="logo-name">STUDYVERSE</span>
              <span class="logo-exam">CA Final · May 2027</span>
            </div>
          </div>
          <button class="sidebar-toggle-btn" id="sidebar-toggle" aria-label="Toggle sidebar">
            <i data-lucide="panel-left"></i>
          </button>
        </div>

        <div class="sidebar-user">
          <div class="user-avatar" id="sidebar-avatar">👤</div>
          <div class="user-info">
            <span class="user-name" id="sidebar-username">Student</span>
            <span class="user-plan">CA Final 2027</span>
          </div>
        </div>

        <nav class="sidebar-nav" id="sidebar-nav">
          <!-- Navigation items injected by JS -->
        </nav>

        <div class="sidebar-footer">
          <div class="exam-countdown" id="sidebar-countdown">
            <span class="countdown-label">May 2027 Exam</span>
            <span class="countdown-days" id="countdown-days">-- days</span>
          </div>
        </div>
      </aside>

      <!-- CONTENT AREA -->
      <main class="main-content" id="main-content">

        <!-- TOP BAR -->
        <header class="topbar" id="topbar">
          <div class="topbar-left">
            <button class="mobile-menu-btn" id="mobile-menu-btn" aria-label="Open menu">
              <i data-lucide="menu"></i>
            </button>
            <div class="page-breadcrumb" id="page-breadcrumb">
              <span class="breadcrumb-icon">🏠</span>
              <span class="breadcrumb-text" id="breadcrumb-text">Dashboard</span>
            </div>
          </div>
          <div class="topbar-center">
            <div class="global-search" id="global-search-container">
              <i data-lucide="search" class="search-icon"></i>
              <input type="text" id="global-search-input" placeholder="Search topics, resources, notes..." class="search-input" />
              <div class="search-results-dropdown" id="search-results-dropdown"></div>
            </div>
          </div>
          <div class="topbar-right">
            <button class="topbar-btn btn-install-pwa" id="pwa-install-btn" onclick="window.SV_installPWA()" title="Install STUDYVERSE App on Phone / PC" style="display:inline-flex; align-items:center; gap:6px; padding:6px 12px; background:var(--brand-primary); color:white; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; border:none;">
              <i data-lucide="download"></i>
              <span>Install App</span>
            </button>
            <button class="topbar-btn" id="theme-toggle-btn" aria-label="Toggle theme" title="Toggle Dark/Light Mode">
              <i data-lucide="sun" id="theme-icon"></i>
            </button>
            <button class="topbar-btn" id="notification-btn" aria-label="Notifications">
              <i data-lucide="bell"></i>
              <span class="notification-badge" id="notification-badge" style="display:none">0</span>
            </button>
            <button class="topbar-btn" id="study-timer-btn" aria-label="Study Timer">
              <i data-lucide="timer"></i>
              <span class="timer-display" id="topbar-timer-display" style="display:none">00:00</span>
            </button>
            <div class="user-menu" id="user-menu-trigger">
              <div class="user-avatar-sm" id="topbar-avatar">👤</div>
            </div>
          </div>
        </header>

        <!-- PAGE CONTAINER -->

  <!-- Service Worker & PWA Install Handler -->
  <script>
    window._pwaPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      window._pwaPrompt = e;
      const btn = document.getElementById('pwa-install-btn');
      if (btn) btn.style.display = 'inline-flex';
    });

    window.SV_installPWA = async function() {
      if (window._pwaPrompt) {
        window._pwaPrompt.prompt();
        const { outcome } = await window._pwaPrompt.userChoice;
        console.log('[PWA] User response:', outcome);
        window._pwaPrompt = null;
      } else {
        alert(
          "📲 How to Install STUDYVERSE on Your Device:\n\n" +
          "• On Android Phone (Chrome):\n  Tap the 3 dots menu (⋮) → Tap 'Install App' or 'Add to Home screen'.\n\n" +
          "• On iPhone / iPad (Safari):\n  Tap the Share button (⎋) at bottom → Tap 'Add to Home Screen' (+).\n\n" +
          "• On Laptop / PC (Chrome / Edge):\n  Look for the install icon ⊕ in the browser address bar, or click Menu → 'Install STUDYVERSE'."
        );
      }
    };

    if ('serviceWorker' in navigator && (window.location.protocol === 'http:' || window.location.protocol === 'https:')) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('[SW] Registered:', reg.scope))
          .catch(err => console.warn('[SW] Registration failed:', err));
      });
    }
  </script>
